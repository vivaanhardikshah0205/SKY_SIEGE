<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;padding:0;height:100%}</style>
<title>Sky Siege 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen WebGL view, DOM HUD on top, overlay panels for menu / drop map / shop */
:root{--bg:#0d1511;--panel:#15231b;--line:#2d4536;--ink:#f4efe0;--muted:#9db3a4;--amber:#ffb020;--danger:#ff5a4d;--good:#5fd38a;--steel:#6fb4ff;--display:"Bungee","Impact",sans-serif;--body:"Chakra Petch","Segoe UI",system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;user-select:none;-webkit-user-select:none}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;inset:0;pointer-events:none}
#hud[hidden]{display:none}
#cross{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px}
#cross i{position:absolute;background:#fff;box-shadow:0 0 3px #000}
#cross i:nth-child(1){left:12px;top:0;width:2px;height:8px}#cross i:nth-child(2){left:12px;bottom:0;width:2px;height:8px}
#cross i:nth-child(3){top:12px;left:0;height:2px;width:8px}#cross i:nth-child(4){top:12px;right:0;height:2px;width:8px}
#cross.hit i{background:var(--danger)}
#hp{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:16px;width:260px}
.bar{height:16px;background:rgba(0,0,0,.55);border:1px solid #000;margin-top:4px}
.bar b{display:block;height:100%;width:50%}
#hpb{background:var(--good)}#arb{background:var(--steel)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.1em;text-shadow:0 1px 2px #000}
#cash{font-family:var(--display);font-size:24px;color:var(--good);text-shadow:0 2px 3px #000;margin-top:6px}
#wp{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:16px;text-align:right;text-shadow:0 1px 3px #000}
#wpn{font-family:var(--display);font-size:22px;color:var(--amber)}
#ammo{font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums}
#slots{display:flex;gap:5px;justify-content:flex-end;margin-top:6px}
.slot{min-width:46px;padding:4px 6px;background:rgba(0,0,0,.55);border:1px solid var(--line);font-size:11px;font-weight:700;text-align:center}
.slot.on{background:var(--amber);color:#1b1405}
#top{position:absolute;top:12px;left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 1px 3px #000}
#obj{font-family:var(--display);font-size:18px;color:var(--amber)}
#sub{font-size:13px;color:var(--ink)}
#mm{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:12px;width:150px;height:150px;border:2px solid var(--line);background:rgba(0,0,0,.45);border-radius:6px}
#prompt{position:absolute;left:50%;top:62%;transform:translateX(-50%);padding:8px 16px;background:rgba(0,0,0,.7);border:2px solid var(--amber);border-radius:6px;font-weight:700;font-size:16px;white-space:nowrap}
#prompt[hidden]{display:none}
#msg{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:var(--display);font-size:clamp(22px,4vw,40px);color:var(--amber);text-shadow:0 3px 6px #000;text-align:center;white-space:nowrap}
#tut{position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:12px;background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:13px;line-height:1.55;max-width:300px}
#tut h4{margin:0 0 4px;font-size:12px;letter-spacing:.14em;color:var(--amber)}
#tut .d{color:var(--good);text-decoration:line-through;opacity:.8}
#tut[hidden]{display:none}
#vig{position:absolute;inset:0;background:radial-gradient(transparent 45%,rgba(255,30,20,.55));opacity:0;transition:opacity .25s}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:rgba(7,13,9,.86);overflow:auto}
#ov[hidden]{display:none}
.panel{width:100%;max-width:820px;max-height:100%;overflow:auto;margin:auto;background:var(--panel);border:2px solid var(--line);padding:22px;box-sizing:border-box;border-radius:6px}
h1{font-family:var(--display);font-size:clamp(34px,8vw,62px);line-height:1;margin:0 0 6px;color:var(--amber);text-wrap:balance}
h2{font-family:var(--display);font-size:clamp(20px,4vw,30px);margin:0 0 6px;color:var(--amber);font-weight:400}
h3{margin:14px 0 8px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sub{margin:0 0 12px;font-size:16px;line-height:1.45;max-width:62ch}
.note{margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.btn{font-family:var(--display);font-size:16px;background:var(--amber);color:#1b1405;border:0;border-bottom:4px solid #b07400;padding:12px 20px;border-radius:5px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}.btn.big{font-size:24px;padding:14px 34px}.btn.alt{background:#27402f;color:var(--ink);border-bottom-color:#162a1e}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.card:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 18px}
.keys>div{display:flex;align-items:center;gap:5px;font-size:15px;min-height:32px}
.keys b{font-weight:600;margin-left:6px}
.k{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 7px;box-sizing:border-box;background:#0b140e;border:1px solid var(--line);border-bottom-width:3px;border-radius:5px;font-weight:700;font-size:13px;color:var(--amber)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:12px}
.card{background:#0f1c14;border:2px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--ink);font-family:var(--body)}
.card .tag{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.12em;padding:2px 7px;border-radius:3px;background:var(--good);color:#06210f}
.card .nm{font-family:var(--display);font-size:19px;color:var(--amber)}
.card .ds{font-size:13px;color:var(--muted);line-height:1.4;flex:1}
.card .pr{font-weight:700;font-variant-numeric:tabular-nums}
.card .btn{font-size:14px;padding:9px 12px}
.money{font-family:var(--display);color:var(--good);font-size:22px}
#mapwrap{position:relative;width:100%;max-width:640px;aspect-ratio:1;margin:8px auto}
#mapc{width:100%;height:100%;display:block;border:2px solid var(--line);border-radius:6px;cursor:crosshair;background:#10202a}
.big-stat{display:flex;gap:22px;flex-wrap:wrap;margin:10px 0}
.big-stat div{display:flex;flex-direction:column}.big-stat b{font-family:var(--display);font-size:28px;color:var(--amber);font-weight:400}
.big-stat span{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
</style>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="hud" hidden>
    <div id="vig"></div>
    <div id="cross"><i></i><i></i><i></i><i></i></div>
    <div id="top"><div id="obj"></div><div id="sub"></div></div>
    <canvas id="mm" width="300" height="300"></canvas>
    <div id="tut"></div>
    <div id="msg"></div>
    <div id="prompt" hidden></div>
    <div id="hp"><div class="lbl">HEALTH <span id="hpt"></span></div><div class="bar"><b id="hpb"></b></div><div class="lbl" style="margin-top:4px">ARMOR</div><div class="bar" style="height:8px"><b id="arb"></b></div><div id="cash"></div></div>
    <div id="wp"><div id="wpn"></div><div id="ammo"></div><div id="slots"></div></div>
  </div>
  <div id="ov"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry(2026);
let best=0;try{best=+localStorage.getItem('ss3d_best')||0}catch(e){}
const poki={s(){try{window.PokiSDK&&PokiSDK.gameplayStart()}catch(e){}},x(){try{window.PokiSDK&&PokiSDK.gameplayStop()}catch(e){}}};

/* ---------- renderer ---------- */
const WORLD=640,HALF=320,SEA=-0.6;
const canvas=$('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xb9d3e6,120,520);
const camera=new THREE.PerspectiveCamera(70,1,.1,1400);
scene.add(camera);
function resize(){const r=$('app').getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
/* lights */
const hemi=new THREE.HemisphereLight(0xcfe6ff,0x6b6a4a,.75);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d6,1.55);sun.position.set(80,120,50);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);const sc=sun.shadow.camera;sc.left=-70;sc.right=70;sc.top=70;sc.bottom=-70;sc.near=10;sc.far=400;sun.shadow.bias=-0.0006;
scene.add(sun);scene.add(sun.target);
const SUNDIR=new THREE.Vector3(80,120,50);
/* sky dome */
const sky=new THREE.Mesh(new THREE.SphereGeometry(1000,24,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
 uniforms:{top:{value:new THREE.Color(0x2f7bd0)},hor:{value:new THREE.Color(0xcfe3f2)}},
 vertexShader:'varying vec3 vp;void main(){vp=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'uniform vec3 top;uniform vec3 hor;varying vec3 vp;void main(){float h=clamp(normalize(vp).y,0.,1.);gl_FragColor=vec4(mix(hor,top,pow(h,.55)),1.);}'}));
scene.add(sky);

/* ---------- procedural textures ---------- */
function tex(size,draw,rep){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');draw(x,size);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;t.anisotropy=4;if(rep)t.repeat.set(rep,rep);return t}
function speckle(x,s,n,cols,mx){for(let i=0;i<n;i++){x.fillStyle=pick(cols);x.globalAlpha=rnd(.05,.25);const w=rnd(1,mx||3);x.fillRect(rnd(0,s),rnd(0,s),w,w)}x.globalAlpha=1}
const T={
 grass:tex(256,(x,s)=>{x.fillStyle='#4f7a36';x.fillRect(0,0,s,s);speckle(x,s,5000,['#3d6a2a','#6a9444','#2f5a22','#7da24f'],3)}),
 sand:tex(128,(x,s)=>{x.fillStyle='#d8c48e';x.fillRect(0,0,s,s);speckle(x,s,2500,['#c2ad78','#eadcad','#b39d68'],2)}),
 asphalt:tex(256,(x,s)=>{x.fillStyle='#3b3d40';x.fillRect(0,0,s,s);speckle(x,s,5000,['#222','#555','#666','#111'],2)}),
 brick:tex(256,(x,s)=>{x.fillStyle='#8a4a3a';x.fillRect(0,0,s,s);for(let r=0;r<16;r++)for(let c=0;c<8;c++){x.fillStyle=pick(['#9a5642','#823f31','#a2604a','#7a3a2e']);const o=(r%2)*16;x.fillRect(c*32+o-16,r*16+1,30,14)}speckle(x,s,1500,['#000','#fff'],2)}),
 plaster:tex(256,(x,s)=>{x.fillStyle='#d9d1bf';x.fillRect(0,0,s,s);speckle(x,s,4000,['#bdb49e','#f3ecdc','#a89f89'],3)}),
 plaster2:tex(256,(x,s)=>{x.fillStyle='#c9b48a';x.fillRect(0,0,s,s);speckle(x,s,4000,['#a8946a','#e0cfa6'],3)}),
 wood:tex(256,(x,s)=>{x.fillStyle='#9a6b3f';x.fillRect(0,0,s,s);for(let i=0;i<8;i++){x.fillStyle=pick(['#8a5c34','#a87846','#7c4f2c']);x.fillRect(0,i*32+1,s,30);for(let k=0;k<30;k++){x.fillStyle='rgba(0,0,0,.08)';x.fillRect(rnd(0,s),i*32+rnd(2,28),rnd(10,60),1)}}}),
 roof:tex(256,(x,s)=>{x.fillStyle='#8c3b2a';x.fillRect(0,0,s,s);for(let r=0;r<8;r++)for(let c=0;c<8;c++){x.fillStyle=pick(['#9a4431','#7d3425','#a24d38']);x.fillRect(c*32+(r%2)*16-16,r*32,30,28)}speckle(x,s,800,['#000'],2)}),
 concrete:tex(256,(x,s)=>{x.fillStyle='#8b8d8c';x.fillRect(0,0,s,s);speckle(x,s,5000,['#6f7170','#a8aaa9','#5b5d5c'],3)}),
 metal:tex(128,(x,s)=>{x.fillStyle='#55603f';x.fillRect(0,0,s,s);speckle(x,s,1500,['#333','#7a8760'],3)})
};
const M=(map,rough,extra)=>new THREE.MeshStandardMaterial(Object.assign({map:map,roughness:rough==null?.9:rough,metalness:0},extra||{}));
const MAT={grass:M(T.grass),sand:M(T.sand),asphalt:M(T.asphalt,.95),brick:M(T.brick),plaster:M(T.plaster),plaster2:M(T.plaster2),wood:M(T.wood,.7),roof:M(T.roof),concrete:M(T.concrete),
 trim:new THREE.MeshStandardMaterial({color:0xf0ece0,roughness:.8}),dark:new THREE.MeshStandardMaterial({color:0x2a2a2c,roughness:.8}),
 cloth:new THREE.MeshStandardMaterial({color:0x7a3b3b,roughness:.9}),cloth2:new THREE.MeshStandardMaterial({color:0x3b4f7a,roughness:.9}),
 line:new THREE.MeshStandardMaterial({color:0xd9c36a,roughness:.9}),door:M(T.wood,.6,{color:0xb8895c})};
const TILE={grass:6,sand:4,asphalt:5,brick:2.2,plaster:2.5,plaster2:2.5,wood:2.2,roof:2.2,concrete:3,trim:1,dark:1,cloth:1,cloth2:1,line:1,door:1};

/* ---------- merged static geometry (one mesh per material) ---------- */
const batch={};
function addBox(mat,cx,cy,cz,w,h,d,rotY,tiltX){
  const g=new THREE.BoxGeometry(w,h,d),uv=g.attributes.uv,ts=TILE[mat]||2;
  const dims=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for(let f=0;f<6;f++)for(let v=0;v<4;v++){const i=f*4+v;uv.setXY(i,uv.getX(i)*dims[f][0]/ts,uv.getY(i)*dims[f][1]/ts)}
  const m=new THREE.Matrix4();const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(tiltX||0,rotY||0,0,'YXZ'));
  m.compose(new THREE.Vector3(cx,cy,cz),q,new THREE.Vector3(1,1,1));g.applyMatrix4(m);
  (batch[mat]=batch[mat]||[]).push(g);
}
function flushBatches(){
  for(const k in batch){const list=batch[k];let nv=0,ni=0;for(const g of list){nv+=g.attributes.position.count;ni+=g.index.count}
    const pos=new Float32Array(nv*3),nor=new Float32Array(nv*3),uv=new Float32Array(nv*2),idx=new Uint32Array(ni);let vo=0,io=0;
    for(const g of list){pos.set(g.attributes.position.array,vo*3);nor.set(g.attributes.normal.array,vo*3);uv.set(g.attributes.uv.array,vo*2);
      const gi=g.index.array;for(let i=0;i<gi.length;i++)idx[io+i]=gi[i]+vo;vo+=g.attributes.position.count;io+=gi.length;g.dispose()}
    const bg=new THREE.BufferGeometry();bg.setAttribute('position',new THREE.BufferAttribute(pos,3));bg.setAttribute('normal',new THREE.BufferAttribute(nor,3));bg.setAttribute('uv',new THREE.BufferAttribute(uv,2));bg.setIndex(new THREE.BufferAttribute(idx,1));
    const me=new THREE.Mesh(bg,MAT[k]);me.castShadow=true;me.receiveShadow=true;scene.add(me);delete batch[k]}
}

/* ---------- colliders on a grid ---------- */
const CELL=8,grid=new Map(),allCol=[];
function gk(i,j){return i*4096+j}
function addCol(x0,y0,z0,x1,y1,z1){
  const c={x0,y0,z0,x1,y1,z1,on:true};allCol.push(c);
  for(let i=Math.floor(x0/CELL);i<=Math.floor(x1/CELL);i++)for(let j=Math.floor(z0/CELL);j<=Math.floor(z1/CELL);j++){const k=gk(i+256,j+256);let a=grid.get(k);if(!a){a=[];grid.set(k,a)}a.push(c)}
  return c;
}
const EMPTY=[];
function cellList(x,z){return grid.get(gk(Math.floor(x/CELL)+256,Math.floor(z/CELL)+256))||EMPTY}
function solidAt(x,y,z){const l=cellList(x,z);for(let i=0;i<l.length;i++){const c=l[i];if(c.on&&x>c.x0&&x<c.x1&&z>c.z0&&z<c.z1&&y>c.y0&&y<c.y1)return true}return false}
function rayBlocked(ax,ay,az,bx,by,bz){
  const dx=bx-ax,dy=by-ay,dz=bz-az,L=Math.hypot(dx,dy,dz),n=Math.ceil(L/.6);
  for(let i=1;i<n;i++){const t=i/n;if(solidAt(ax+dx*t,ay+dy*t,az+dz*t))return true}return false;
}
/* walk-on height under a point (only surfaces up to step height above feet) */
function groundAt(x,z,feet,step,r){
  let gh=0;const rr=r||0.3;
  for(let ci=-1;ci<=1;ci++)for(let cj=-1;cj<=1;cj++){
    if(Math.abs(ci)+Math.abs(cj)==2&&rr<.5)continue;
    const l=cellList(x+ci*CELL*.5*(rr>.5?1:0),z+cj*CELL*.5*(rr>.5?1:0));
    for(let i=0;i<l.length;i++){const c=l[i];if(!c.on)continue;
      if(x>c.x0-rr&&x<c.x1+rr&&z>c.z0-rr&&z<c.z1+rr&&c.y1<=feet+step+0.01&&c.y1>gh)gh=c.y1}
  }
  return gh;
}
/* circle push-out against boxes that block at this height */
function pushOut(e,r,h,step){
  for(let pass=0;pass<2;pass++){
    const seen=[];
    for(let ci=-1;ci<=1;ci++)for(let cj=-1;cj<=1;cj++){
      const l=cellList(e.x+ci*CELL*.5,e.z+cj*CELL*.5);
      for(let i=0;i<l.length;i++){const c=l[i];if(!c.on||seen.indexOf(c)>=0)continue;seen.push(c);
        if(!(c.y1>e.y+step&&c.y0<e.y+h))continue;
        const cx=clamp(e.x,c.x0,c.x1),cz=clamp(e.z,c.z0,c.z1),dx=e.x-cx,dz=e.z-cz,d2=dx*dx+dz*dz;
        if(d2<r*r){
          if(d2>1e-8){const d=Math.sqrt(d2),k=(r-d)/d;e.x+=dx*k;e.z+=dz*k}
          else{const l1=e.x-c.x0,r1=c.x1-e.x,t1=e.z-c.z0,b1=c.z1-e.z,m=Math.min(l1,r1,t1,b1);
            if(m===l1)e.x=c.x0-r;else if(m===r1)e.x=c.x1+r;else if(m===t1)e.z=c.z0-r;else e.z=c.z1+r}
        }}
    }
  }
  e.x=clamp(e.x,-HALF+r,HALF-r);e.z=clamp(e.z,-HALF+r,HALF-r);
}
/* ray vs spheres/ world: stepping world test */
function worldHit(o,d,maxD){const n=Math.ceil(maxD/.5);for(let i=1;i<=n;i++){const t=i*.5;if(o.y+d.y*t<0)return t;if(solidAt(o.x+d.x*t,o.y+d.y*t,o.z+d.z*t))return t}return maxD}
function raySphere(o,d,c,r){const ox=o.x-c.x,oy=o.y-c.y,oz=o.z-c.z,b=ox*d.x+oy*d.y+oz*d.z,cc=ox*ox+oy*oy+oz*oz-r*r,disc=b*b-cc;if(disc<0)return -1;const t=-b-Math.sqrt(disc);return t>0?t:(-b+Math.sqrt(disc)>0?0.01:-1)}

/* ---------- world: ground, sea, scenery ---------- */

function makeBuilding(cx,cz,W,D,floors,k,style){
  const th=.3,H1=3.0,SL=.2,FH=3.2,top=floors===2?6.2:3.0;
  const ang=k*Math.PI/2,c=Math.cos(ang),s=Math.sin(ang),swap=k%2===1;

  function B(mat,lx,y0,lz,w,h,d,col){
    if(w<=0||d<=0||h<=0)return null;

    addBox(mat,p[0],y0+h/2,p[1],ww,h,dd);

    for(const o of ops){const s0=o.c-o.w/2,e0=o.c+o.w/2;part(cur,s0,yb,yt);if(o.sill>0)part(s0,e0,yb,yb+o.sill);if(o.top<yt-yb)part(s0,e0,yb+o.top,yt);
      if(o.sill>0){if(axis==='x')B('trim',(s0+e0)/2,yb+o.sill-.06,fixed+(fixed>0?.12:-.12),o.w+.3,.06,.5,false);else B('trim',fixed+(fixed>0?.12:-.12),yb+o.sill-.06,(s0+e0)/2,.5,.06,o.w+.3,false)}

    const hx=x0+9*pr;
    B('concrete',0,H1,(zs+sw+D/2)/2,W,SL,D/2-(zs+sw));
    B('concrete',(hx+W/2)/2,H1,zs+sw/2-th/2,W/2-hx,SL,sw+th);

  {const a=.38,half=D/2+.5,len=half/Math.cos(a),rise2=Math.tan(a)*D/4;const base=top+SL;
   for(const sg of[-1,1]){const p=tr(0,sg*D/4);addBox('roof',p[0],base+rise2*.55,p[1],W+.8,.16,len,-ang,sg*a)}
   for(let i=0;i<3;i++){const hh=(i+1)*rise2/3.2,ww=D*(1-(i+.6)/3.3);for(const sx of[-1,1]){const p=tr(sx*(W/2-.1),0);addBox('plaster',p[0],base+(i+.5)*rise2/3.2*1.0,p[1],swap?ww:.3,rise2/3.2,swap?.3:ww)}}}
  /* door leaf */
  {const hp=tr(dx-.65,D/2-th/2),dl=new THREE.Group();dl.position.set(hp[0],0,hp[1]);dl.rotation.y=-ang;
   const leaf=new THREE.Mesh(new THREE.BoxGeometry(1.26,2.3,.1),MAT.door);leaf.position.set(.65,1.15,0);leaf.castShadow=true;dl.add(leaf);
   const kn=new THREE.Mesh(new THREE.SphereGeometry(.06,8,6),new THREE.MeshStandardMaterial({color:0xcaa24a,metalness:.8,roughness:.3}));kn.position.set(1.1,1.1,.08);dl.add(kn);scene.add(dl);
   const cp=tr(dx,D/2-th/2),ww=swap?.12:1.3,dd=swap?1.3:.12;

  if(floors===2){B('cloth2',W/2-1.1,FH+SL-.2+.0,.6,1.0,.5,2.0);B('wood',FX,FH,-D/2+1.3,1.3,.78,.8);B('wood',-W/2+th+.4,FH,D/2-1.8,.5,1.9,1.4)}
  /* partition in bungalows */
  if(floors===1&&W>=12){const px=-W/2+5.0;wall('z',px,-D/2+th,D/2-th,[{c:-D/4,w:1.2,sill:0,top:2.3}],0,H1,'plaster')}

  const rec={x0:cx-(swap?D:W)/2,x1:cx+(swap?D:W)/2,z0:cz-(swap?W:D)/2,z1:cz+(swap?W:D)/2,style,floors};
  bldgs.push(rec);occupied.push(rec);

  const rare=style==='bungalow';

  if(lootU&&Math.random()<.65)lootSpots.push(Object.assign(lootU,{tier:2}));
  guardSpots.push(Object.assign(lp(-W/2+6.5,0,D/4),{upper:false,rect:rec}));
  if(floors===2)guardSpots.push(Object.assign(lp(W/2-3.5,FH,D/4-1),{upper:true,rect:rec}));
}

      const th=raySphere(o,d,{x:e.x,y:e.y+1.72*e.sc,z:e.z},.24*e.sc);if(th>0&&th<bt){bt=th;hitE=e;head=true;hitP=null}
      const tb=raySphere(o,d,{x:e.x,y:e.y+.95*e.sc,z:e.z},.5*e.sc);if(tb>0&&tb<bt){bt=tb;hitE=e;head=false;hitP=null}}
    for(const p of planes){if(p.dead)continue;for(const off of[-3,0,3]){const t2=raySphere(o,d,{x:p.x+Math.sin(p.yaw)*off,y:p.y,z:p.z+Math.cos(p.yaw)*off},3.6);if(t2>0&&t2<bt){bt=t2;hitE=null;hitP=p}}}
    const hp={x:o.x+d.x*bt,y:o.y+d.y*bt,z:o.z+d.z*bt};
    if(i<3||g.pel===1)tracer(mz,hp);
    if(hitE){hurtPerson(hitE,dmg*(head?2.2:1),true);hitT=.15;sfx.hit();puff(hp.x,hp.y,hp.z,4,0x8a1c1c,2.5,.4,.1,8);if(hitE.dead&&head)msg('HEADSHOT!',1)}
    else if(hitP){hurtPlane(hitP,dmg*.9);hitT=.15;sfx.hit();puff(hp.x,hp.y,hp.z,3,0xffd27a,3,.3,.12,2)}
    else if(bt<g.range-1)puff(hp.x,hp.y,hp.z,4,0xcfc4a8,2.5,.45,.1,6);
  }
  if(w.ammo<=0)reloadGun();
}
function alertNear(src,r){for(const e of enemies)if(!e.dead&&e.alert<=0&&Math.hypot(e.x-src.x,e.z-src.z)<r){e.alert=6;e.lkx=src.x;e.lkz=src.z}}
function checkWin(){if(state!=='play')return;if(!enemies.some(e=>!e.dead)&&planesSpawned>0&&!planes.some(p=>!p.dead))setTimeout(()=>endGame(true),900)}
function owned(){return ORDER.filter(id=>P.own[id])}
function switchGun(id){if(P.own[id]&&P.cur!==id&&!P.vehicle){P.cur=id;P.mesh.setGun(id);P.fcd=.25;sfx.click()}}

/* ---------- UI ---------- */
const ov=$('ov'),hud=$('hud'),mm=$('mm'),mmx=mm.getContext('2d');
const kc=(...a)=>a.map(x=>'<span class="k">'+x+'</span>').join('');
function show(h){ov.innerHTML=h;ov.hidden=false}
function hideOv(){ov.hidden=true;ov.innerHTML=''}
function unlock(){lockWanted=false;try{if(document.pointerLockElement)document.exitPointerLock()}catch(e){}}
function lock(){lockWanted=true;try{const p=canvas.requestPointerLock&&canvas.requestPointerLock();if(p&&p.catch)p.catch(()=>{lockWanted=false})}catch(e){lockWanted=false}}
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===canvas;if(!locked&&lockWanted&&state==='play')showPause()});
document.addEventListener('pointerlockerror',()=>{lockWanted=false;locked=false});
function controlsHTML(){return '<div class="keys">'+
 '<div>'+kc('W','A','S','D')+'<b>Move</b></div><div>'+kc('Mouse')+'<b>Look (or arrow keys)</b></div>'+
 '<div>'+kc('R')+'<b>Shoot (also left click)</b></div><div>'+kc('Right click')+'<b>Aim / sniper zoom</b></div>'+
 '<div>'+kc('E')+'<b>Take gun / open door / enter vehicle</b></div><div>'+kc('Shift')+'<b>Sprint</b></div>'+
 '<div>'+kc('Space')+'<b>Jump / open parachute / brake</b></div><div>'+kc('Q')+kc('1-6')+'<b>Switch gun</b></div>'+
 '<div>'+kc('T')+'<b>Reload</b></div><div>'+kc('B')+'<b>Gun shop</b></div>'+
 '<div>'+kc('C')+'<b>Team: follow / hold position</b></div><div>'+kc('M')+'<b>Big map</b></div>'+
 '<div>'+kc('P')+'<b>Pause</b></div><div>'+kc('N')+'<b>Sound on / off</b></div></div>'}
function showMenu(){state='menu';hud.hidden=true;
  show('<div class="panel"><h1>SKY SIEGE 3D</h1><p class="sub">Choose where to land on the island, jump from the plane and parachute down with your 5-person team. Search houses and bungalows for hidden guns, drive a scooter, jeep or tank, shoot down enemy planes and clear every enemy.</p><div class="row"><button class="btn big" data-a="drop" id="goBtn">CHOOSE LANDING SPOT</button></div><h3>Controls</h3>'+controlsHTML()+
  '<p class="note">If your browser blocks mouse capture, look with the arrow keys or hold right click and move the mouse. Every 6 kills you choose 1 of 3 guns. Best score: '+best+'</p></div>')}
function showDrop(){state='drop';unlock();hud.hidden=true;
  show('<div class="panel"><h2>CHOOSE YOUR LANDING SPOT</h2><p class="note" style="margin:0 0 6px">Click the map. Towns have more houses, guns and enemies. Blue circle = your drop.</p><div id="mapwrap"><canvas id="mapc" width="640" height="640"></canvas></div><div class="row"><button class="btn big" data-a="jump">JUMP!</button><button class="btn alt" data-a="menu">BACK</button></div></div>');
  drawIsland($('mapc'),true);
  const c=$('mapc');c.addEventListener('click',e=>{const r=c.getBoundingClientRect();landX=((e.clientX-r.left)/r.width-.5)*WORLD;landZ=((e.clientY-r.top)/r.height-.5)*WORLD;drawIsland(c,true)});
}
function drawIsland(c,sel){
  const x=c.getContext('2d'),s=c.width/WORLD,X=v=>(v+HALF)*s;
  x.fillStyle='#1f6d8f';x.fillRect(0,0,c.width,c.height);x.fillStyle='#d8c48e';x.fillRect(X(-HALF-15),X(-HALF-15),(WORLD+30)*s,(WORLD+30)*s);x.fillStyle='#4f7a36';x.fillRect(X(-HALF+10),X(-HALF+10),(WORLD-20)*s,(WORLD-20)*s);
  x.fillStyle='#4a4d50';for(const r of roadRects)x.fillRect(X(r.x0+4),X(r.z0+4),(r.x1-r.x0-8)*s,(r.z1-r.z0-8)*s);
  for(const b of bldgs){x.fillStyle=b.style==='house'?'#b5654a':'#c9a35e';x.fillRect(X(b.x0),X(b.z0),(b.x1-b.x0)*s,(b.z1-b.z0)*s)}
  x.font='700 15px sans-serif';x.textAlign='center';for(const t of TOWNS){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(X(t.x)-52,X(t.z)-34,104,20);x.fillStyle='#fff';x.fillText(t.n,X(t.x),X(t.z)-19)}
  if(sel){x.strokeStyle='#6fb4ff';x.lineWidth=4;x.fillStyle='rgba(111,180,255,.35)';x.beginPath();x.arc(X(landX),X(landZ),16,0,TAU);x.fill();x.stroke()}
  else if(P){for(const e of enemies)if(!e.dead){x.fillStyle='#ff5a4d';x.fillRect(X(e.x)-2,X(e.z)-2,4,4)}for(const a of allies)if(!a.dead){x.fillStyle='#6fb4ff';x.fillRect(X(a.x)-3,X(a.z)-3,6,6)}
    for(const v of vehicles)if(!v.dead){x.fillStyle='#ffb020';x.fillRect(X(v.x)-3,X(v.z)-3,6,6)}
    x.fillStyle='#fff';x.beginPath();x.arc(X(P.x),X(P.z),6,0,TAU);x.fill()}
}
function showPause(){if(state!=='play')return;state='pause';poki.x();unlock();show('<div class="panel"><h2>PAUSED</h2><div class="row"><button class="btn" data-a="resume">RESUME</button><button class="btn alt" data-a="menu">QUIT</button></div><h3>Controls</h3>'+controlsHTML()+'</div>')}
function showMap(){if(state!=='play')return;state='map';unlock();show('<div class="panel"><h2>ISLAND MAP</h2><p class="note" style="margin:0">White = you, blue = team, red = enemies, orange = vehicles.</p><div id="mapwrap"><canvas id="mapc" width="640" height="640"></canvas></div><div class="row"><button class="btn" data-a="resume">CLOSE (M)</button></div></div>');drawIsland($('mapc'),false)}
function gunCard(id,mode){const g=GUNS[id],o=P.own[id];
  const st='<div class="note" style="margin:0">DMG '+Math.round(g.dmg*(1+.25*(o?o.lvl+(mode==='pick'?1:0):0)))+(g.pel>1?' ×'+g.pel:'')+' · RATE '+g.rate+'/s · MAG '+g.mag+'</div>';
  if(mode==='pick')return '<button class="card" data-a="pick" data-id="'+id+'"><span class="tag">'+(o?'UPGRADE LV '+(o.lvl+2):'NEW GUN')+'</span><span class="nm">'+g.n+'</span><span class="ds">'+g.ds+'</span>'+st+'</button>';
  const price=o?Math.round(g.price*.5+60):g.price,can=P.cash>=price;
  return '<div class="card">'+(o?'<span class="tag">OWNED LV '+(o.lvl+1)+'</span>':'')+'<span class="nm">'+g.n+'</span><span class="ds">'+g.ds+'</span>'+st+'<span class="pr">'+(o?'Upgrade ':'')+'$'+price+'</span><button class="btn'+(o?' alt':'')+'" data-a="buy" data-id="'+id+'"'+(can?'':' disabled')+'>'+(o?'+25% DAMAGE':'TAKE GUN')+'</button></div>'}
function showShop(){if(state!=='play'&&state!=='shop')return;state='shop';tut.shop=1;poki.x();unlock();
  let h='<div class="panel"><h2>GUN SHOP</h2><div class="row"><span class="money">$'+P.cash+'</span><span class="note" style="margin:0">Earn cash from kills. Press B to close.</span></div><div class="cards">';
  for(const id of ORDER)if(id!=='pistol')h+=gunCard(id,'shop');
  h+='<div class="card"><span class="nm">Ammo</span><span class="ds">Refill reserve ammo for all guns.</span><span class="pr">$40</span><button class="btn alt" data-a="ammo"'+(P.cash>=40?'':' disabled')+'>BUY</button></div>';
  h+='<div class="card"><span class="nm">Medkit</span><span class="ds">Restore all health.</span><span class="pr">$60</span><button class="btn alt" data-a="med"'+(P.cash>=60&&P.hp<100?'':' disabled')+'>HEAL</button></div>';
  h+='<div class="card"><span class="nm">Body Armor</span><span class="ds">Absorbs half of incoming damage.</span><span class="pr">$120</span><button class="btn alt" data-a="armor"'+(P.cash>=120?'':' disabled')+'>BUY</button></div>';
  h+='</div><div class="row"><button class="btn" data-a="resume">BACK TO BATTLE</button></div></div>';show(h)}
function showPick(){state='pick';poki.x();unlock();const pool=ORDER.filter(i=>i!=='pistol'),un=pool.filter(i=>!P.own[i]).sort(()=>Math.random()-.5),ow=pool.filter(i=>P.own[i]).sort(()=>Math.random()-.5),o=un.concat(ow).slice(0,3);
  let h='<div class="panel"><h2>'+P.kills+' KILLS! CHOOSE A GUN</h2><p class="sub">Pick ONE of these 3 guns. Whatever you take, you get.</p><div class="cards">';for(const id of o)h+=gunCard(id,'pick');show(h+'</div></div>')}
function endGame(win){if(state==='over')return;state='over';poki.x();unlock();const score=P.kills*10+(win?500:0)+Math.max(0,Math.round(900-time))*(win?1:0);
  if(score>best){best=score;try{localStorage.setItem('ss3d_best',String(best))}catch(e){}}
  setTimeout(()=>show('<div class="panel"><h1 style="color:'+(win?'var(--good)':'var(--danger)')+'">'+(win?'ISLAND CLEARED!':'YOU FELL')+'</h1><div class="big-stat"><div><b>'+score+'</b><span>Score</span></div><div><b>'+P.kills+'</b><span>Kills</span></div><div><b>'+allies.filter(a=>!a.dead).length+'/5</b><span>Team alive</span></div><div><b>'+Math.round(time)+'s</b><span>Time</span></div></div><p class="note">Best score: '+best+'</p><div class="row"><button class="btn big" data-a="drop">PLAY AGAIN</button><button class="btn alt" data-a="menu">MENU</button></div></div>'),win?600:1400)}
function resume(){if(!P)return;hideOv();state='play';poki.s();lock()}
ov.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,id=b.dataset.id;actx();
  if(a==='drop')showDrop();else if(a==='menu')showMenu();
  else if(a==='jump'){hideOv();hud.hidden=false;newGame();lock()}
  else if(a==='resume')resume();
  else if(a==='buy'){const o=P.own[id],g=GUNS[id],pr=o?Math.round(g.price*.5+60):g.price;if(P.cash>=pr){P.cash-=pr;if(o){o.lvl++;o.ammo=g.mag;o.res+=g.mag*2}else giveGun(id);sfx.buy();showShop()}}
  else if(a==='ammo'&&P.cash>=40){P.cash-=40;for(const k in P.own)P.own[k].res+=GUNS[k].mag*3;sfx.buy();showShop()}
  else if(a==='med'&&P.cash>=60){P.cash-=60;P.hp=100;sfx.buy();showShop()}
  else if(a==='armor'&&P.cash>=120){P.cash-=120;P.armor=100;sfx.buy();showShop()}
  else if(a==='pick'){giveGun(id);resume()}
});
/* ---------- interaction ---------- */
let target=null;
function findTarget(){
  if(P.vehicle)return{txt:'Press E to exit '+P.vehicle.type,fn:()=>leaveVehicle()};
  if(P.phase!=='ground')return null;let best=null,bd=1e9;
  const cand=(d,txt,fn)=>{if(d<bd){bd=d;best={txt,fn}}};
  for(const l of loots)if(!l.taken&&Math.abs(l.y-P.y)<2){const d=Math.hypot(l.x-P.x,l.z-P.z);if(d<2.3)cand(d,'Press E to take '+lootName(l),()=>takeLoot(l))}
  for(const dr of doors){const d=Math.hypot(dr.x-P.x,dr.z-P.z);if(d<2.4&&P.y<2)cand(d+.5,'Press E to '+(dr.open?'close':'open')+' door',()=>toggleDoor(dr,!dr.open))}
  const v=nearVeh();if(v)cand(Math.hypot(v.x-P.x,v.z-P.z)-.5,'Press E to drive '+v.type,()=>enterVehicle(v));
  return best;
}
/* ---------- HUD ---------- */
function updateHUD(){
  $('hpb').style.width=P.hp+'%';$('hpt').textContent=Math.ceil(P.hp);$('arb').style.width=P.armor+'%';$('cash').textContent='$'+P.cash;
  const g=GUNS[P.cur],w=P.own[P.cur];$('wpn').textContent=P.vehicle?(P.vehicle.type==='tank'?'TANK CANNON':P.vehicle.type.toUpperCase()):g.n+(w.lvl?' LV'+(w.lvl+1):'');
  $('ammo').textContent=P.vehicle?(P.vehicle.type==='tank'?(P.vehicle.reload>0?'RELOAD':'READY'):Math.round(Math.abs(P.vehicle.speed)*3.6)+' km/h'):(w.rel>0?'RELOAD':w.ammo+' / '+w.res);
  $('slots').innerHTML=owned().map((id,i)=>'<div class="slot'+(id===P.cur?' on':'')+'">'+(ORDER.indexOf(id)+1)+' '+GUNS[id].n.split(' ')[0]+'</div>').join('');
  const left=enemies.filter(e=>!e.dead).length,pl=planes.filter(p=>!p.dead).length;
  $('obj').textContent=P.phase==='sky'||P.phase==='chute'?'DROPPING IN':'CLEAR THE ISLAND';
  $('sub').textContent='Enemies left '+left+(planesSpawned?'  ·  Planes '+pl:'')+'  ·  Team '+allies.filter(a=>!a.dead).length+'/5  ·  Kills '+P.kills+(holdMode?'  ·  TEAM: HOLD':'')+(P.phase==='sky'?'  ·  Space = open parachute':'');
  $('cross').className=hitT>0?'hit':'';
  const done=TUTL.filter(t=>tut[t[0]]>=t[2]).length;
  if(done>=TUTL.length||time>240)$('tut').hidden=true;else{$('tut').hidden=false;$('tut').innerHTML='<h4>TRAINING '+done+'/'+TUTL.length+'</h4>'+TUTL.map(t=>'<div class="'+(tut[t[0]]>=t[2]?'d':'')+'">'+t[1]+'</div>').join('')}
  const pr=$('prompt');if(target&&state==='play'){pr.hidden=false;pr.textContent=target.txt}else pr.hidden=true;
  if(msgT>0){msgT-=dtG;if(msgT<=0)$('msg').textContent=''}
}
function drawMini(){
  const W=mm.width,sc=W/160;mmx.clearRect(0,0,W,W);mmx.save();mmx.translate(W/2,W/2);mmx.rotate(P.yaw);
  const X=v=>(v)*sc*.9;
  mmx.fillStyle='#3d6a2a';mmx.fillRect(-W,-W,2*W,2*W);
  mmx.fillStyle='#4a4d50';for(const r of roadRects)mmx.fillRect(X(r.x0+4-P.x),X(r.z0+4-P.z),X(r.x1-r.x0-8),X(r.z1-r.z0-8));
  for(const b of bldgs){mmx.fillStyle=b.style==='house'?'#b5654a':'#c9a35e';mmx.fillRect(X(b.x0-P.x),X(b.z0-P.z),X(b.x1-b.x0),X(b.z1-b.z0))}
  const dot=(o,c,r)=>{mmx.fillStyle=c;mmx.beginPath();mmx.arc(X(o.x-P.x),X(o.z-P.z),r,0,TAU);mmx.fill()};
  for(const e of enemies)if(!e.dead&&(e.alert>0||Math.hypot(e.x-P.x,e.z-P.z)<35))dot(e,'#ff5a4d',5);
  for(const a of allies)if(!a.dead)dot(a,'#6fb4ff',5);for(const v of vehicles)if(!v.dead)dot(v,'#ffb020',6);
  for(const p of planes)if(!p.dead)dot(p,'#ffffff',7);
  mmx.restore();mmx.fillStyle='#fff';mmx.beginPath();mmx.moveTo(W/2,W/2-12);mmx.lineTo(W/2-8,W/2+8);mmx.lineTo(W/2+8,W/2+8);mmx.closePath();mmx.fill();
}
/* ---------- input ---------- */
addEventListener('keydown',e=>{
  actx();if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code)&&state==='play')e.preventDefault();
  if(keys[e.code]&&e.repeat){return}keys[e.code]=true;
  if(e.code==='KeyN'){muted=!muted;return}
  if(state==='play'){
    if(e.code==='KeyE'&&target)target.fn();
    else if(e.code==='KeyB')showShop();else if(e.code==='KeyM')showMap();else if(e.code==='KeyP'||e.code==='Escape')showPause();
    else if(e.code==='KeyT')reloadGun();else if(e.code==='KeyC'){holdMode=!holdMode;msg(holdMode?'Team: HOLD position':'Team: FOLLOW me',1.5)}
    else if(e.code==='KeyQ'){const l=owned(),i=l.indexOf(P.cur);switchGun(l[(i+1)%l.length])}
    else if(/^Digit[1-6]$/.test(e.code)){const id=ORDER[+e.code.slice(5)-1];if(id)switchGun(id)}
  }else if(state==='shop'&&(e.code==='KeyB'||e.code==='Escape'))resume();
  else if(state==='map'&&(e.code==='KeyM'||e.code==='Escape'))resume();
  else if(state==='pause'&&(e.code==='KeyP'||e.code==='Escape'))resume();
});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouseDown=false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('mousedown',e=>{actx();if(state!=='play')return;if(!locked)lock();if(e.button===0)mouseDown=true;if(e.button===2)aiming=true});
addEventListener('mouseup',e=>{if(e.button===0)mouseDown=false;if(e.button===2)aiming=false});
addEventListener('mousemove',e=>{if(state!=='play'||!P)return;if(locked||(e.buttons&2)){const s=(aiming&&GUNS[P.cur].zoom?.0009:.0024);P.yaw-=e.movementX*s;P.pitch=clamp(P.pitch-e.movementY*s,-1.3,1.2);tut.look+=Math.abs(e.movementX)*.01}});
/* ---------- main loop ---------- */
let last=performance.now(),dtG=.016;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;dtG=dt;
  if(!P||state==='menu'||state==='drop'){
    const a=now*.00008;camera.position.set(Math.cos(a)*180,70,Math.sin(a)*180);camera.lookAt(0,5,0);renderer.render(scene,camera);return}
  if(state==='play'){
    time+=dt;
    if(keys.ArrowLeft)P.yaw+=1.8*dt;if(keys.ArrowRight)P.yaw-=1.8*dt;if(keys.ArrowUp)P.pitch=Math.min(1.2,P.pitch+1.2*dt);if(keys.ArrowDown)P.pitch=Math.max(-1.3,P.pitch-1.2*dt);
    playerUpdate(dt);updateVehicles(dt);updateDoors(dt);
    for(const a of allies)if(!a.dead)(a.air?aiAllyAir(a,dt):aiAlly(a,dt));
    for(const e of enemies)if(!e.dead){const d=Math.hypot(e.x-P.x,e.z-P.z);if(d<170||e.alert>0)aiEnemy(e,dt);else e.mesh.position.set(e.x,e.y,e.z)}
    corpseUpdate(dt);updatePlanes(dt);updateProjs(dt);fxUpdate(dt);
    if(P.phase==='ground'||P.phase==='veh'){planeT-=dt;if(planeT<=0&&planesSpawned<3){planesSpawned++;spawnPlane();planeT=40}}
    if(pickDue>0){pickDue-=dt;if(pickDue<=0)showPick()}
    for(const l of loots)if(!l.taken){l.ph+=dt*2;l.mesh.rotation.y=l.ph}
    target=findTarget();
    /* indoor fill light */
    const ind=P.y<6.3&&(solidAt(P.x,3.1,P.z)||solidAt(P.x,6.3,P.z));hemi.intensity=lerp(hemi.intensity,ind?1.15:.75,dt*4);
    camUpdate(dt);updateHUD();drawMini();
  }
  renderer.render(scene,camera);
}
showMenu();requestAnimationFrame(frame);
window.addEventListener('beforeunload',()=>{});
})();
</script>
